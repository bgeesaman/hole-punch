<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hole Punch</title>
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
    <link rel="stylesheet" href="./src/style.css" />
    <!-- No bundler: bare module names resolve to the vendored copies (see vendor/README.md). -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/",
          "@dimforge/rapier3d-compat": "./vendor/rapier/rapier.mjs"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud" class="overlay">
      <div class="hud-row">
        <div class="hud-item"><span class="label">LEVEL</span><span id="hud-level">1</span></div>
        <div class="hud-item"><span class="label">TIME</span><span id="hud-time">0:00</span></div>
        <div class="hud-item"><span class="label">SCORE</span><span id="hud-score">0</span> / <span id="hud-target">0</span></div>
        <div class="hud-item"><span class="label">HOLE</span><span id="hud-hole" class="pips"></span></div>
        <div class="hud-item"><span class="label">LEFT</span><span id="hud-left">0</span></div>
        <button id="hud-muted" class="icon-btn hud-muted" title="Muted. Click or press M to unmute" aria-label="Unmute" hidden>🔇</button>
      </div>
    </div>
    <div id="hint" class="overlay">click to capture mouse</div>
    <div id="intro" class="overlay intro" hidden><span id="intro-text"></span></div>
    <div id="debug" class="overlay" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
