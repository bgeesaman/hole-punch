<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hole Punch</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud" class="overlay">
      <div class="hud-row">
        <div class="hud-item"><span class="label">LEVEL</span><span id="hud-level">1</span></div>
        <div class="hud-item"><span class="label">TIME</span><span id="hud-time">0:00</span></div>
        <div class="hud-item"><span class="label">SCORE</span><span id="hud-score">0</span> / <span id="hud-target">0</span></div>
        <div class="hud-item"><span class="label">HOLE</span><span id="hud-hole" class="pips"></span></div>
        <div class="hud-item"><span class="label">LEFT</span><span id="hud-left">0</span></div>
      </div>
    </div>
    <div id="hint" class="overlay">click to capture mouse</div>
    <div id="intro" class="overlay intro" hidden><span id="intro-text"></span></div>
    <div id="debug" class="overlay" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
